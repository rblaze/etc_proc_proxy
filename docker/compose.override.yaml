services:
  litellm:
    # Use litellm image with OUTBOUND_PROXY support
    image: litellm-patched:v1
    environment:
      - LITELLM_DISABLE_NO_REDIS_WARNING=True
      - LITELLM_MASTER_KEY=sk-1234
      - OUTBOUND_HTTP_PROXY=https://grpc_proxy:11111
      - DISABLE_OUTBOUND_PROXY_TLS_VERIFICATION=True
    env_file: !override
      - /dev/null
    volumes:
      - ./configs/litellm_config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
  db:
    container_name: !reset
  prometheus:
    profiles:
      - disabled

volumes:
  postgres_data:
    # Reuse existing litellm database
    external: true
