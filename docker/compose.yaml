include:
  - ./litellm/docker-compose.yml

services:
  grpc_proxy:
    # Point to local ext_proc_proxy image
    image: ext_proc_proxy:v2
    command: --self-signed --port 11111 --ext-proc-port 11112 --ext-proc-target http://litellm:4000
    depends_on:
      - litellm

  envoy:
    image: envoyproxy/envoy:v1.39.1
    ports:
      - "10000:10000"
      - "9901:9901"
    command: --config-path /etc/envoy/envoy.yaml --file-flush-interval-msec 0 --file-flush-min-size-kb 0 # --component-log-level router:debug,dns:debug
    volumes:
      - ./configs/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - grpc_proxy

  otel-collector:
    image: otel/opentelemetry-collector:0.151.0
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      # - 1888:1888 # pprof extension
      # - 8888:8888 # Prometheus metrics exposed by the Collector
      # - 8889:8889 # Prometheus exporter metrics
      # - 13133:13133 # health_check extension
      # - 4317:4317 # OTLP gRPC receiver
      # - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension

  # echo:
  #   image: jmalloc/echo-server
  #   environment:
  #     - LOG_HTTP_BODY=true
  #     - LOG_HTTP_HEADERS=true
